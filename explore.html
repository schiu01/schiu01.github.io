        Select Top <select>
                        <option value="2000">All</option>
                        <option>10</option>
                        <option>20</option>
                        <option>30</option>
                        <option>50</option>
                        <option>100</option>
                    </select> Players

                        <option value="2000">All</option>
                        <option>10</option>

<div style="border: 1px solid #999999; background-color: #EEEEEE; margin: 10px; padding: 5px; border-radius: 10px;">
    <table>
        <tr>
            <td>Select World Cup Team: </td><td>
                
                <div class="fifa-code-tag-container"  id="dropdown-fifa-code" style="border: 1px solid #ccc; padding: 5px; display: inline-flex; flex-wrap: wrap; gap: 5px; min-width: 300px;"></div>
                  <input type="text" id="input-fifa-code" list="datalist-fifa-code" placeholder="Type or select..." style="border: none; outline: none; flex-grow: 1;" />
                  <datalist id="datalist-fifa-code"></datalist>

            </td>
        </tr>
    </table>
</div>    
<div style="border: 1px solid #999999; background-color: #EEEEEE; margin: 10px; padding: 10px; border-radius: 10px;">
    Search Club Name and Club's Country.
    <table cellpadding="5px">
        <tr>
            <td>Search By Club's Region: </td><td>
                    <div class="region-tag-container"  id="dropdown-region" style="border: 1px solid #ccc; padding: 5px; display: inline-flex; flex-wrap: wrap; gap: 5px; min-width: 300px;"></div>
                  <input type="text" id="input-region" list="datalist-region" placeholder="Type or select..." style="border: none; outline: none; flex-grow: 1;" />
                  <datalist id="datalist-region"></datalist>

            </td>
        </tr>
        <tr>
            <td>Search By Club's Country: </td><td>
                <div class="country-tag-container"  id="dropdown-country" style="border: 1px solid #ccc; padding: 5px; display: inline-flex; flex-wrap: wrap; gap: 5px; min-width: 300px;"></div>
                  <input type="text" id="input-country" list="datalist-country" placeholder="Type or select..." style="border: none; outline: none; flex-grow: 1;" />
                  <datalist id="datalist-country"></datalist>

            </td>
        </tr>
        <tr>
            <td>Search By Club Name: </td><td>
                <div class="club-tag-container"  id="dropdown-club" style="border: 1px solid #ccc; padding: 5px; display: inline-flex; flex-wrap: wrap; gap: 5px; min-width: 300px;"></div>
                  <input type="text" id="input-club" list="datalist-club" placeholder="Type or select..." style="border: none; outline: none; flex-grow: 1;" />
                  <datalist id="datalist-club"></datalist>

            </td>
        </tr>
        <tr>
            <td>Search By Players: </td><td>
                <div class="player-tag-container"  id="dropdown-player" style="border: 1px solid #ccc; padding: 5px; display: inline-flex; flex-wrap: wrap; gap: 5px; min-width: 300px;"></div>
                  <input type="text" id="input-player" list="datalist-player" placeholder="Type or select..." style="border: none; outline: none; flex-grow: 1;" />
                  <datalist id="datalist-player"></datalist>


                </div></td>
        </tr>
        <tr><td colspan=2><button onclick="return explore_update_chart();">Update Chart</button></td><td><button>Reset Filters</button></td></tr>
    </table>
</div>
