        draw_bubble_chart({"mode": "explore_adhoc"})

    }

    /**
     * 
     *  Helper Function:  Highlight the lines betwen the club circle and the country team circle to identify the players link
     * 
     *  Input Parameters: this identifies where the click is coming from - from club circle (club_team) or from world cup team circle (fifa code)
     *                    - if the click is coming from club_team, then fifa_code will be null and vice versa
     * 
     *  Behaviour: Hide all the other clubs except the one clicked - so it shows clearly the lines and the circle.
     *  Additional Behaviour: display, if exists, any top 10 players of the tournament that belongs to the club.
     * 
     * */
    function activate_by_club(club_team) {
                
            // Set the selected club to be highlighted and increase the radius

            //var all_circles = d3.selectAll("circle[club_team]")
            // Select only circles from bubble chart.
            var all_circles = bubblechartCanvas.selectAll("circle[club_team]")
            all_circles
            .style("visibility", d => { if (d.club_team != club_team) {return  "hidden"}})

            var all_text = d3.selectAll("text[club_team]")
            all_text
            .style("visibility", d => { if (d.club_team != club_team) {return  "hidden"}})


            var club_lines = d3.selectAll("line")

    /**
     *  Function Name: filter_by_mode
     *  Filter By mode - filters out the data based on mode of operation
     *  Filter By Region: Only selects a slice of data based on certain Club Region.
     *  Filter By country: Only selects a slice of data based on certain Club's country.
     *  Filter by Fifa Code: Only selects a slice of data based on World Cup team country
     *  Adhoc filter (explore_adhoc): Ability to filter either by player, club's country or region (multi choice enabled.)
     * */
    function filter_by_mode(mode, data_tmp) {
        var return_data = [];
        if(mode['mode'] == "filter_by_region" && mode['region_name'] != 'All Regions') {
            //console.log(mode)
            if(mode['show_all_clubs']) { top_teams_count = 100;}
            
            data_tmp.forEach((d,i) => {
                if(d.club_region == mode['region_name']) {
                    return_data.push(d)
                }
            })
        }
        else if(mode['mode'] == "filter_by_region" && mode['region_name'] == 'All Regions') {
                    //console.log(mode)
                    if(mode['show_all_clubs']) { top_teams_count = 25;}
                    return_data = data_tmp

        } else if (mode['mode'] == "filter_by_country") {
            if(mode['show_all_clubs']) { top_teams_count = 450}
            if(mode['show_all_players']) { num_of_top_players_visible = 100; }
            data_tmp.forEach((d,i) => {
                if(mode['fifa_code'].includes(d.teams_fifa_code)) {
                    return_data.push(d)
                }
            })


        } 
        else if (mode['mode'] == "filter_by_fifa_code") {
            list_fifa_code = d3.selectAll(".wcteam-tag").nodes().map(n => n.textContent)
            if(list_fifa_code.length > 0) {
                data_tmp.forEach((d,i) => {
                    if(list_fifa_code.includes(d.teams_fifa_code)) {
                        return_data.push(d)
                    }
                })

            } else {
                return_data = data_tmp
            }
            

        }
        else if (mode['mode'] == "explore_adhoc") {
            // Fine Grain filtering hierarchy
            // Player -> Club Name -> Club's Country  -> Club Region
            num_of_top_players_visible = 1000;
            top_teams_count = 300;
            filter_option = [
                {"tag_name": ".player-tag", "column_name_reference": "player_name"},
                {"tag_name": ".club-tag", "column_name_reference": "club_team"},
                {"tag_name": ".country-tag", "column_name_reference": "club_country_name"},
                {"tag_name": ".region-tag", "column_name_reference": "club_region"},
            ]
            var filtered_data = false;
            for(var i=0; i<filter_option.length; i++) {
                var d = filter_option[i] ;
                var array_values = d3.selectAll(d["tag_name"]).nodes().map(n => n.textContent);
                
                if(array_values.length > 0) {
                    data_tmp.forEach((dd,i) => {
                        if(array_values.includes(dd[d['column_name_reference']])) {
                            return_data.push(dd)
                        }
                    })
                    
                    //return return_data;
                    filtered_data = true
                    break;

                }

            }

            // if none are found.
            if(! filtered_data) { return_data = data_tmp}


        }
        else {
            return_data = data_tmp
        }

        //console.log(return_data)
        return return_data

    }

    async function populate_narrative_text(slide_num) {
            // reset
            top_teams_count = 25;

            if(slide_num == 2) {
                num_of_top_players_visible = 1000;

                    .on("click", function(event) {populate_narrative_text(slide_num+1)})
            }

            }
